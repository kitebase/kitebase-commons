# The roles a user holds, added to `User` by deep_merge.
#
# A flat list of role codes: the tree lives in the definitions (`implies`), so
# assigning a supervisor brings what the supervisor implies with no second
# entry. Codes, not foreign keys: roles are declared in YAML, not stored as rows.

tables:

  User:

    columns:

      - name: roles
        label: "Roles"
        type: Json
        default: []
        validate: acl_roles

      # The user's own exceptions to the roles: `+Publisher.create` grants,
      # `-Book.read` denies, and the denial wins (guard.py). For the narrow
      # case: a design that needs many of them wants another role.
      - name: acl_exceptions
        label: "Access exceptions"
        type: Json
        default: []
        validate: acl_exceptions

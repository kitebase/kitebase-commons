# The Roles tab of the user form, added to the `sections` tabs of users.
#
# Two fields, each with the widget for whoever assigns and a JSON text for
# whoever would rather type the codes: the roles, and in Access the user's own
# exceptions, on the matrix of what roles and exceptions give together
# (client/Access.svelte). All edit the same draft, and the validators of the
# columns (endpoints.py) name a code nobody declared.

pages:

  user_form:
    content:
      layout:
        - id: sections
          pages:
            - id: roles
              label: Roles
              layout:
                - id: roles_main
                  type: section
                  columns:
                    - id: roles_pick
                      fields:
                        - name: roles
                          label: Roles
                          widget: checklist
                          choices_endpoint: acl_roles
                          help: A role brings the roles it implies, shown checked and greyed.
                - id: roles_text
                  type: section
                  label: As text
                  columns:
                    - id: roles_json
                      fields:
                        - name: roles
                          label: Role codes, as JSON
                          widget: json
            # What the draft gives, resolved by the server; a click on a cell
            # forces it for this user alone.
            - id: access
              label: Access
              layout:
                - id: access_main
                  type: section
                  columns:
                    - id: access_matrix
                      fields:
                        - name: acl_exceptions
                          label: What this user may do
                          widget: acl.access
                          help: >-
                            The roles give the cells; a click forces one for this user
                            alone, granted (+) or denied (-). A denial wins over the roles.
                - id: access_text
                  type: section
                  label: As text
                  columns:
                    - id: access_json
                      fields:
                        - name: acl_exceptions
                          label: Exceptions, as JSON
                          widget: json

# Printing through AndRep — under construction.
#
# The plugin is AndRep's *context adapter* for Kitebase: the one place that knows
# both sides. It hands the renderer Kitebase's records (read-only views of the
# SQLAlchemy models), Kitebase's files (the media roots, through a resolver) and
# Kitebase's templates (the `andrep/` folders of the plugins, plus the
# installation layer). AndRep itself stays a library that knows nothing about
# Kitebase.
#
# It cannot be called `andrep`: the folder name becomes a Python package, and it
# would shadow the library it exists to use. Its name is also the domain of the
# report endpoints (`reports.print`, `reports.run`).
#
# Nothing here yet: no tables, no endpoints, no Python. No application should
# include it until it has them — see README.md for the state and the plan.

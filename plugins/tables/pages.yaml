# The plugin brings the page, not its place: the application puts it in its
# menu, usually among the administration items.
#
#   tables: { label: Tables, icon: table, parent: masters, action: stack_push, panel: tables_browser }

pages:
  tables_browser:
    title: Tables
    access: tables.browse
    content:
      type: plugin
      component: tables.browser
      props:
        # Pruned like any command: without tables.seed it is not there
        commands:
          - { id: seed_compare, label: Compare with seed or file, scope: row, endpoint: seed_choose, icon: git-compare }

  # Opened by the command, with {table, set} or {table, rows, source}: the rows
  # of the table against a set, or against a file the user uploaded
  tables_seed_compare:
    title: Comparison
    access: tables.seed
    content:
      type: plugin
      component: tables.seedcompare

# The shapes every application turns out to need, named once.
#
# Without them each application decides again how long a code is, whether a name
# is indexed, how money is rounded — and decides it differently in each table,
# because the decision is made where the column is written. Here a column says
# *what it is*, and how it is stored is one line, in one place: raise `ShortStr`
# to 64 and every code in every application follows.
#
# They carry the interface too. `widget:`, `label:` and `help:` travel with the
# type, so a form and a list know how to render a column without being told.
#
# It is a vocabulary, not a constraint: what does not fit is derived, not
# argued with.

types:

  ID:
    base: Integer
    primary_key: True
    autoincrement: True
    label: "Unique Identifier"
    help: |
      The primary key for the table

  ShortID:
    base: String
    length: 32
    primary_key: True
    label: "Unique Identifier"
    help: |
      The primary key for the table

  # A chain, one decision per link: `ShortStr` fixes a width, `Code` adds the
  # index, `UpperStr` the case. A column then names the combination it wants
  # instead of restating it, and a decision added to a link reaches everything
  # below it — which is also how an application extends the vocabulary, by
  # hanging its own link off the one that already says most of what it means.
  ShortStr:
    base: String
    length: 32

  Code:
    base: ShortStr
    index: True

  # A key nobody types, kept as text in the canonical 36-character form. It is
  # minted on insert by the server (`$uuid`) unless the client brings its own,
  # as offline devices do. Not editable, because a key that changes is a
  # different record. Not SQLAlchemy's `UUID`: that is the native type, which
  # takes uuid.UUID objects only, so every JSON string would need converting.
  # A column that only *cites* such a key is not one: it neither mints nor is
  # unique, so it declares its own shape.
  UuidStr:
    base: String
    length: 36
    default: $uuid
    deferred: True      # minted at save: a form leaves it to the server
    editable: False
    unique: True

  # For identifiers whose alphabet is upper case anyway — tax and VAT numbers,
  # ISO codes: the value is normalised on write, searches included, so the code
  # around them never has to convert.
  UpperStr:
    base: ShortStr
    case: upper

  UpperCode:
    base: UpperStr
    index: True

  # Not nullable by its own definition: this is the type of what a record cannot
  # be without — say `Description` and the column is required without saying so.
  Description:
    base: String
    nullable: False

  Name:
    base: Description
    index: True

  Password:
    base: String
    nullable: False
    widget: password
    label: "Password"
    help: |
      Please insert a robust password and keep it safe
    # Never leaves the server, and is hashed on the way in. Empty on write means
    # "unchanged" — the client has no way of echoing back what it cannot read.
    secret: true
    on_write: password_hash
    # The rules a new password must pass (common/validators.py), set in the
    # application's config.yaml under `password_policy:`.
    validate: password_policy

  Email:
    base: String
    widget: email
    validate: email_validator

  Json:
    base: JSON
    widget: json
    default: {}

  Markdown:
    base: Text
    widget: markdown

  Phone:
    base: String
    widget: tel
    length: 20

  URL:
    base: String
    widget: url
    length: 512

  Color:
    base: String
    widget: color
    length: 7
    label: "Color"
    help: "Hex color code (e.g., #FF5733)"

  FilePath:
    base: String
    widget: filepath
    length: 512
    label: "File Path"
    help: "Path to uploaded file or resource"

  Money:
    base: Numeric
    widget: currency
    precision: 10
    scale: 2

  Percent:
    base: Numeric
    widget: percent
    precision: 5
    scale: 2

  Quantity:
    base: Numeric
    precision: 12
    scale: 3

  # When a row appeared and when it was last touched. Two columns nobody wants
  # to declare and everybody wants to have — the first question asked of any
  # record that looks wrong.
  TimeStamp:
    label: "Timestamp"
    columns:
      # `$now` and not `datetime.now`: the same instant, read through the
      # timezone the app declares rather than the one the process happens to
      # run in (kitebase.apptime). It is also the single place that answers
      # "when is now", so moving the storage to UTC one day is one function.
      #
      # `query_rank: more`: asked when something looks wrong, not every day, so
      # the query editor keeps them behind "Show more".
      - name: created_at
        type: DateTime
        granularity: second
        default: $now
        nullable: False
        query_rank: more
      - name: updated_at
        type: DateTime
        granularity: second
        default: $now
        onupdate: $now
        nullable: False
        query_rank: more

  # Five columns that always travel together, declared once: every table that
  # has an address has the same one, and widening it here reaches them all.
  # `prefix:` lets a single table carry two of them — home_city, work_city.
  Address:
    label: "Address"
    columns:
      - name: address
        type: String
      - name: city
        type: String
      - name: state
        type: ShortStr
      - name: zip
        type: ShortStr
      - name: country
        type: String

  # Retiring a row instead of deleting it — the history that points at it stays
  # readable. More than a column: the Python class of the same name is a query
  # behaviour, registered once at startup, so every table carrying the mixin
  # hides its archived rows without a single view asking for it.
  Archivable:
    label: "Archivable"
    columns:
      # `query_rank: more`: the archive command is how a list chooses active,
      # archived or all; a condition on the flag is the rare case.
      - name: active
        type: Boolean
        default: true
        nullable: false
        label: "Active"
        query_rank: more

  # What makes a table able to log in. Kept as one unit because authentication
  # reads all of it — the application points its `authentication` config at any
  # table carrying this, and system users and application users can be separate
  # tables without either growing its own idea of what a login is.
  Credentials:
    label: "Authentication Credentials"
    columns:
      - name: username
        type: ShortStr
        unique: true
        nullable: false
        label: "Username"
        help: "Unique login username"
      - name: password
        type: Password
        label: "Password"
      - name: email
        type: Email
        unique: true
        nullable: false
        label: "Email"
      - name: is_active
        type: Boolean
        default: true
        nullable: false
        label: "Active"
      - name: last_login
        type: DateTime
        label: "Last Login"

tables:

  Config:
    name: configs
    label: "Configuration"
    help: |
      Wide app configuration file
    tags: [short]

    columns:
      - name: id
        type: ShortID

      - name: description
        type: Description

      - name: group
        type: ShortStr

      - name: help
        type: Markdown

      - name: value
        type: String

      - name: values
        type: Json

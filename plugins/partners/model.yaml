# Business partners: one table for every subject the company deals with —
# customers, suppliers, members, contacts, addresses. What separates the roles
# is the view, not the table. See README.md.
#
# Invariant: **role-specific columns are always nullable in the schema**, and
# requiredness belongs to the view as a reactive `required` — a NOT NULL column
# of one role would stop every other role from being created.
#
# Deliberately not here: a registry-wide `code`, the registry data of a natural
# person (in `persons`), a `merged_into` pointer. README.md says why.

tables:

  Partner:
    name: partners
    label: "Partner"
    help: |
      Any subject the company deals with. Roles (customer, supplier, member…)
      are held in `roles` as a delimited set, so one subject can be several
      things at once without being entered twice.
    tags: [master]
    mixins: [TimeStamp, Archivable]

    columns:

      - name: id
        type: ID

      # `person` | `organization`. A closed set owned by the code, and the one
      # discriminator everything shares.
      #
      # Write the test on the person side, `kind == 'person'`, so kinds added
      # later (public body, group) fall among the non-persons. A sole trader is
      # a `person`. Legal form is not a value here — it is a property *of* an
      # organization, and gets its own column.
      #
      # Nullable because a child row that is only an address is neither; the
      # view makes it required on `parent_id == null`.
      - name: kind
        type: ShortStr
        label: "Kind"

      # Official designation, and the display field everywhere. For a person it
      # is "Surname, Given": the comma is what makes composing and decomposing
      # both possible, which is why the parts are not separate columns.
      - name: name
        type: Name
        label: "Name"

      # Shop sign, when it differs from the registered name. Searchable, never
      # the display: whoever types "Riverside Hardware" is shown "Smith, John".
      - name: trade_name
        type: String
        label: "Trade name"

      - name: title
        type: ShortStr
        label: "Title"
        help: "Mr., Mrs., Dr. — free text, suggestions come from the view"

      # Part of addressing someone, like `title` and the channels below — which
      # is why it is here and not in `persons`.
      #
      # `M` and `F` are the values the code knows: agreement in correspondence,
      # and the tax codes built from one of the two. Write the test on that side
      # so the others land where a rule written before them expects. `N` is not
      # the same as empty — asked and declined, against never asked.
      - name: gender
        type: UpperStr
        length: 1
        label: "Gender"
        help: "M male, F female, O other, N not declared"

      # A delimited set of role codes: ",C,S,". The delimiters are not
      # decoration — ",C," can never match ",CO,", where packed characters would
      # let "C" match inside "CS" and break every filter, silently.
      #
      # Not indexed: a LIKE with a leading wildcard would not use the index.
      - name: roles
        type: String
        length: 255
        label: "Roles"

      # Parent subject, for rows that hang off another one: a contact person, a
      # delivery address, a billing address. Qualified by `usage` below.
      # A child row is a *part* of its parent: a contact or an address means
      # nothing without the subject it hangs off, so it goes when the subject
      # goes. In practice a master is archived and never deleted, so what this
      # really governs is the row deleted from the collection grid — which is a
      # real delete, on a table that is Archivable for its masters. The verb
      # belongs to the node, not to the table.
      - name: parent_id
        label: "Belongs to"
        foreign_key:
          target: Partner.id
          owned: true
          # Named explicitly: the generated pair would be `partners_parent`,
          # correct and unreadable.
          relation: parent
          backref: children

      # What a child row is, relative to its parent:
      #   contact | invoice | delivery | operational
      # Empty for top-level subjects. Kept apart from `kind` because the two
      # answer different questions: what the row *is*, against how it is *used*.
      # A plain column and not a registry — the code branches on these values,
      # and the view offers them as a fixed choice.
      - name: usage
        type: ShortStr
        label: "Usage"

      # Identify the subject the way the name does, which is why they are here
      # and not in a fiscal plugin; what is country-specific is validation, and
      # a plugin adds that without owning the column.
      #
      # Neither is unique — foreign subjects, private individuals, and genuine
      # duplicates until someone unifies them. Indexed, and they are what the
      # duplicate warning is built on.
      - name: vat_number
        type: UpperCode
        label: "VAT number"

      - name: tax_code
        type: UpperCode
        label: "Tax code"

      # Main address inline; further addresses are child rows with a `usage`.
      # That is why there is no address table: a child row already carries a
      # full address, a name and its own channels.
      - name: address
        type: Address

      # Primary channels inline — searched, exported and printed without a join.
      # Further ones are child rows, same as addresses.
      - name: email
        type: Email
        label: "Email"

      - name: phone
        type: Phone
        label: "Phone"

      - name: mobile
        type: Phone
        label: "Mobile"

      - name: website
        type: URL
        label: "Website"

      - name: notes
        type: Markdown
        label: "Notes"

  # The application declares its roles in `data:` and they are reconciled at
  # startup: reconciliation writes only the declared keys, and never deletes a
  # row — a dropped row would leave its code inside the `roles` of existing
  # partners with nothing left to name it.
  PartnerRole:
    name: partner_roles
    label: "Partner role"
    help: |
      The roles a partner may hold. Each row's code is what is stored inside
      `Partner.roles`: this table is the vocabulary that views, domains and
      defaults are written against.
    tags: [reference]

    columns:

      - name: id
        type: ShortID
        label: "Code"

      - name: label
        type: Description
        label: "Label"

      # Never declared in a plugin's `data:` — numbers picked by two plugins
      # collide with nothing to arbitrate them. A declaration carries the
      # position instead (`$after` / `$before`), and a reordering made from the
      # UI is never overwritten.
      - name: sequence
        type: Integer
        label: "Sequence"
        default: 0
        nullable: false
        help: "Display order; also decides which role wins when two would fill the same field"

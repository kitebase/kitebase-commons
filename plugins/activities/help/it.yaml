# Translations of the guide, kept in step with the English by `kitebase sync-help`.
# Translate the value under the language; an empty one shows the English.
# `en_old` is the English the translation was made on: review it, then remove the line.

tables.Activity:
  en: |-
    Calls, meetings, notes and things to do, on the records they concern.
    With a due date or a start it is to do; with no date it is recorded as
    done.
  it: |-
    Chiamate, appuntamenti, note e cose da fare, sui record che riguardano.
    Con una scadenza o un inizio è da fare; senza data è registrata come
    fatta.

tables.Activity.columns.user_id:
  en: 'Who does it, or did it: whoever writes it, unless someone else is named.'
  it: 'Chi la fa, o l''ha fatta: chi la scrive, se non si indica un altro.'

tables.Activity.columns.author_id:
  en: 'Who wrote it: when it is not the person it is assigned to, it is a request from them. Empty when the system wrote it.'
  it: 'Chi l''ha scritta: se non è chi deve farla, è una sua richiesta. Vuota quando l''ha scritta il sistema.'

tables.Activity.columns.start_at:
  en: For an appointment, when it starts.
  it: Per un appuntamento, quando comincia.

tables.Activity.columns.done_at:
  en: When it was done; empty while it is to do.
  it: Quando è stata fatta; vuota finché è da fare.

tables.Activity.columns.priority:
  en: 'From -9 to 9, higher first: 0 is normal, 9 the most urgent, below 0 what is parked or waits for time.'
  it: 'Da -9 a 9, più alto prima: 0 è normale, 9 la massima urgenza, sotto lo 0 ciò che è parcheggiato o aspetta che ci sia tempo.'

tables.Activity.columns.source:
  en: Filled when the activity was written automatically (a mail sent, a stage changed); empty when a person wrote it.
  it: Compilata quando l'attività è stata scritta in automatico (una mail spedita, uno stadio cambiato); vuota quando l'ha scritta una persona.

tables.ActivityType:
  en: The kinds of activity, such as call, meeting, note.
  it: I tipi di attività, come chiamata, appuntamento, nota.

tables.ActivityType.columns.icon:
  en: The name of an icon, such as phone or mail.
  it: Il nome di un'icona, come phone o mail.

tables.ActivityType.columns.pick:
  en: Offered when a person writes an activity; off for a type only the system writes, or one no longer used.
  it: Proposto quando una persona scrive un'attività; spento per un tipo che scrive solo il sistema, o che non si usa più.

# A light CRM: opportunities moving through the stages of a pipeline, won or
# lost, with the activities that tell their story. One pipeline is enough for
# most; the seed writes two when the table is born, sales and renewals, and
# another pipeline is a row, with stages of its own.
#
# See README.md.
name: crm
version: 0.0.1
description: Opportunities through the stages of a pipeline, won or lost
license: MIT
author: "Claudio Driussi"
url: https://claudiodriussi.it
depends_on: [common, users, partners, activities]
# Email on an opportunity, to its partner, where the app loads smtp (mail.py)
optional:
  smtp: [mail]

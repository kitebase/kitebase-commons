# The forms of the CRM. Menu-silent like the rest of the commons: where the
# lists surface is the application's call. Lowercase `{model}_form`, so each is
# the form its lists open.

pages:

  # Every opportunity, closed ones included: the list is where the closed are
  # found again. The same rows on the board, the stages of one pipeline at a
  # time; the closed leave it by a rule the user may take away.
  #
  # The two pages share their source through a YAML anchor: `&name` names a
  # node, `*name` repeats it. The parser resolves it, inside one file only,
  # and kitebase sees two equal sources. `$ref` is kitebase's own: it reaches
  # across files and plugins, and the keys beside it win.
  opportunity_list:
    title: Opportunities
    help: Every negotiation, the closed ones too. Click a row to see its story on the right; switch to the board to work stage by stage.
    content:
      $ref: views.opportunity_table
      source: &opportunity_source
        model: Opportunity
        joins:
          - Partner: {type: left, "on": "Opportunity.partner_id = Partner.id"}
          - Pipeline: {type: left, "on": "Opportunity.pipeline_id = Pipeline.id"}
          - Stage: {type: left, "on": "Opportunity.stage_id = Stage.id"}
          - User: {type: left, "on": "Opportunity.user_id = User.id"}
        order_by: [Pipeline.sequence, Stage.sequence, name]

    # The story of the row clicked, beside the list as beside the board
    panels: &opportunity_panels
      - id: activities
        pos: right
        width: 380
        trigger: { event: row_click, pass: [id] }
        type: plugin
        component: activities.timeline
        props:
          model: Opportunity

  # A campaign and what it brought: the figures in the list, the
  # opportunities it is the origin of beside it, its activities below.
  campaign_list:
    title: Campaigns
    help: Each campaign with what it brought. Click one to see the opportunities it is the origin of, and below its contacts, to follow up one by one.
    content:
      type: table
      source:
        model: Campaign
        order_by: [-start_date, name]
      columns:
        - field: name
          title: Campaign
        - field: start_date
          title: From
          width: 110
        - field: end_date
          title: To
          width: 110
        - field: contacted
          title: Contacted
          width: 110
        - field: to_handle
          title: To handle
          width: 110
        - field: opportunity_count
          title: Opportunities
          width: 120
        - field: won_count
          title: Won opportunities
          width: 150
        - field: won_amount
          title: Won value
          width: 130
    panels:
      - id: opportunities
        pos: right
        width: 460
        trigger: { event: row_click, pass: [id] }
        $ref: views.campaign_opportunities
      # The contacts of the campaign: one still to do that went well becomes
      # an opportunity, with its partner and this campaign (endpoints.py)
      - id: activities
        pos: bottom
        height: 300
        trigger: { event: row_click, pass: [id] }
        type: plugin
        component: activities.timeline
        props:
          model: Campaign
          commands:
            - id: opportunity
              label: Create opportunity
              endpoint: crm_opportunity_from_activity
              todo: true

  opportunity_board:
    title: Opportunity board
    help: Your open negotiations, one column per stage. Drag a card to move it, click it to see its story, double-click to open it.
    content:
      $ref: views.opportunity_table
      type: kanban
      allow_views: [kanban, table]
      source: *opportunity_source
      # The open ones of whoever opens it: rules the user sees and may take
      # away, to look at a colleague's board or everyone's. Hiding the others'
      # for good is an access rule (README.md), not this.
      rules:
        - {field: outcome, op: eq, value: open}
        - {field: user_id, op: eq, value: $user_id}
    panels: *opportunity_panels

  # The stage offered is one of the opportunity's pipeline (lookup.filters);
  # rules.py refuses the others on every port. The choices of `outcome` are
  # the column's, in the model.
  opportunity_form:
    title: Opportunity
    help: A negotiation with a partner. Its activities are at the bottom; won and lost are commands of the list and the board.
    content:
      type: form
      source:
        model: Opportunity
        id: $props.id
      layout:
        - id: deal
          type: section
          columns:
            - id: main
              fields:
                - name: name
                  width: 60%
                - name: partner_id
                  width: 40%
                # Left empty, rules.py fills them: the first pipeline, its first stage
                - name: pipeline_id
                  width: 30%
                  required: false
                  help: The kind of negotiation. Left empty, the first one.
                - name: stage_id
                  width: 30%
                  required: false
                  help: Where the negotiation stands. Left empty, the first stage of its pipeline.
                  lookup:
                    filters: {pipeline_id: $record.pipeline_id}
                - name: user_id
                  width: 40%
                - name: amount
                  width: 25%
                - name: expected_date
                  width: 25%
                - name: priority
                  widget: combobox
                  choices:
                    - { value: 0, label: Normal }
                    - { value: 1, label: "*" }
                    - { value: 2, label: "**" }
                    - { value: 3, label: "***" }
                  width: 20%
                - name: campaign_id
                  width: 30%
        - id: text
          type: section
          columns:
            - id: main
              fields:
                - name: description
                  widget: textarea
        - id: closing
          type: section
          columns:
            - id: main
              fields:
                - name: outcome
                  width: 20%
                - name: closed_at
                  width: 20%
                - name: lost_reason_id
                  width: 60%
                - filler:
                - name: lost_note
                  widget: textarea
        # Its activities in the form: they are linked to it, not owned, so
        # they are in the history of the partner too. In a tabs even alone,
        # the hook another plugin needs to put a sibling beside it.
        - id: relations
          type: tabs
          pages:
            - id: activities_tab
              label: Activities
              layout:
                - type: plugin
                  component: activities.timeline

  # A pipeline and its stages, in the order the board shows them: moved by
  # hand, numbered on save.
  pipeline_form:
    title: Pipeline
    help: A kind of negotiation and its stages, in the order the board shows them. Move a stage with the handle to change its place.
    content:
      type: form
      source:
        model: Pipeline
        id: $props.id
      layout:
        - id: header
          type: section
          columns:
            - id: main
              fields:
                - name: name
                  width: 70%
                - name: sequence
                  width: 15%
                - name: active
                  width: 15%
        - id: relations
          type: tabs
          pages:
            - id: stages_tab
              label: Stages
              count: stages
              layout:
                - type: collection
                  id: stages
                  model: Stage
                  fk: pipeline_id
                  sequence: sequence
                  view:
                    type: table
                    columns:
                      - field: name
                        title: Stage
                        width: 320
                      - field: folded
                        title: Folded

views:

  opportunity_table:
    type: table
    allow_views: [table, kanban]
    columns:
      - field: name
        title: Opportunity
      - field: Partner.name as partner
        title: Partner
      - field: Pipeline.name as pipeline
        title: Pipeline
        width: 130
      - field: Stage.name as stage
        title: Stage
        width: 130
      - field: amount
        title: Expected amount
        width: 130
      - field: expected_date
        title: Expected closing
        width: 130
      - field: User.name as salesperson
        title: Salesperson
        width: 140
      - field: outcome
        title: Outcome
        width: 100
      - field: next_activity
        title: Next activity
      - field: next_due
        title: Next date
        width: 110
      # Read by the card's ribbon: green, orange today, red overdue
      - field: next_state
        title: Next step
        visible: false
        tone:
          values: { planned: success, today: warning, overdue: danger }
    card:
      title: name
      subtitle: partner
      ribbon: next_state
      details: [amount, salesperson, next_activity, next_due]
    kanban:
      sum: amount
    # Closing is a deliberate act, never a drag: the stage stays where it
    # closed. Lost asks why, from the lost reasons (endpoints.py).
    navigator:
      commands:
        - id: won
          label: Won
          help: Closes the negotiation as won. It stays in the stage it reached.
          icon: trophy
          toolbar: true
          scope: row
          key: w
          endpoint: crm_close
          params: { outcome: won }
        - id: lost
          label: Lost
          help: Closes the negotiation as lost, asking why. It stays in the stage where it was lost, so the figures show where negotiations stop.
          icon: thumbs-down
          toolbar: true
          scope: row
          key: l
          endpoint: crm_close
          params: { outcome: lost }
        - id: plan
          label: Plan an activity
          help: 'Plans the next thing to do on this negotiation: a call, a meeting, a reminder. The card shows it until it is done.'
          icon: calendar-plus
          toolbar: true
          scope: row
          key: p
          endpoint: crm_plan
        - id: reopen
          label: Open again
          help: Opens a closed negotiation again.
          scope: row
          endpoint: crm_close
          params: { outcome: open }
        - id: salesperson
          label: Hand to another salesperson
          help: 'Gives the ticked negotiations, or the one under the cursor, to another salesperson: when someone is away or leaves.'
          icon: user-round
          scope: global
          endpoint: crm_salesperson
        # With smtp only (mail.py): without it the endpoints are not there,
        # and the view leaves the commands out
        - id: write_email
          label: Write an email
          help: Writes an email to the partner of this negotiation. Once sent, it is in the story of the negotiation.
          icon: mail
          scope: row
          key: e
          endpoint: smtp_compose
        - id: sent_email
          label: Email sent
          help: The messages sent about this negotiation.
          scope: row
          endpoint: smtp_sent_page

  # The next step of a negotiation, in a dialog from the board or the list
  # (endpoints.py fills the types and the first values).
  crm_plan_form:
    type: form
    presentation: dialog
    source: {}
    layout:
      - type: section
        id: plan
        fields:
          - name: type
            label: Type
            type: String
            required: true
          - name: subject
            label: Subject
            type: String
            required: true
          - name: due_date
            label: Due
            type: Date
            required: true
          - name: note
            label: Note
            type: Text
            widget: textarea

  # A contact for a campaign, from the ticked partners (endpoints.py fills the
  # campaigns and the types). With no date it is done now; with one, to do.
  crm_campaign_form:
    type: form
    presentation: dialog
    source: {}
    layout:
      - type: section
        id: contact
        fields:
          - name: campaign_id
            label: Campaign
            type: Integer
            required: true
          - name: type
            label: Type
            type: String
            required: true
          - name: subject
            label: Subject
            type: String
            required: true
          - name: due_date
            label: Due
            type: Date
            help: With a date the contact is to do, and stays open until it has its outcome. Empty, it is recorded as done now.
          - name: note
            label: Note
            type: Text
            widget: textarea

  # The commands this plugin adds to every list of partners: the view is the
  # partners plugin's, merged by id.
  partner_table:
    navigator:
      commands:
        - id: new_opportunity
          label: New opportunity
          help: Opens a new opportunity for this partner.
          icon: target
          scope: row
          key: o
          endpoint: crm_new_opportunity
        - id: campaign_contact
          label: Contact for a campaign
          help: Records a contact for a campaign with each ticked partner, or with the one under the cursor.
          icon: megaphone
          scope: global
          endpoint: crm_campaign_contact

  # The opportunities a campaign is the origin of, beside the campaigns
  campaign_opportunities:
    type: table
    source:
      model: Opportunity
      joins:
        - Partner: {type: left, "on": "Opportunity.partner_id = Partner.id"}
        - Stage: {type: left, "on": "Opportunity.stage_id = Stage.id"}
      filters:
        conditions:
          - Opportunity.campaign_id: ["=", "$trigger.id"]
      order_by: [name]
    navigator:
      hide: [add]
    columns:
      - field: name
        title: Opportunity
      - field: Partner.name as partner
        title: Partner
      - field: Stage.name as stage
        title: Stage
        width: 110
      - field: outcome
        title: Outcome
        width: 90

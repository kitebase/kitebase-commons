# demo — third-party dependencies, and its own virtual environment.
#
#   uv sync            create .venv and install
#   uv run kite.py     run inside it
#
# The demo is the reference consumer of these plugins, and it runs against the
# kitebase checkout beside it, editable: in the workspace `uv run` uses the
# library as it is on disk, with no flag to remember. Both web frameworks come
# along: the demo ships a server for each, and having the pair is what makes
# double support a checked property.
#
# Outside the workspace the paths below do not resolve: point the sources at a
# tag of the kitebase and andrep repositories instead.

[project]
name = "demo"
version = "0.0.1"
description = "Reference app for the kitebase shared plugins"
requires-python = ">=3.11"

dependencies = [
    "kitebase[flask,fastapi]",
    # The renderer the `reports` plugin prints with: PDF through Playwright,
    # whose browser is installed once with `uv run playwright install chromium`.
    "andrep[playwright,sqlalchemy]",
]

[tool.uv]
package = false

[tool.uv.sources]
kitebase = { path = "../../server", editable = true }
# The workspace's checkout (tools/clone-all.sh puts it there).
andrep = { path = "../../andrep/renderer", editable = true }

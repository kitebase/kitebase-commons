tables:

  # A call to Ross of Northwind is in the history of Northwind too
  Partner:
    activities.follow: [parent_id]

views:

  # The mail sent in the history of its records: on by default for a message
  # written by hand, off for a merge, where every record would get one. The
  # param `activity` is what the bridge of activities reads (activities/mail.py)
  smtp_compose_form:
    source:
      defaults: { activity: true }
    layout:
      - id: text
        fields:
          - &compose_activity
            name: activity
            label: Record in the history
            type: Boolean
            help: The message becomes a done activity of the record it was written on.

  smtp_merge_form:
    layout:
      - id: text
        fields:
          - &merge_activity
            name: activity
            label: Record in the history
            type: Boolean
            help: Each message becomes a done activity of its record.

  # The history of the partner under the cursor, under the list: the form
  # stays whole, and the history scrolls on its own however long it grows
  partner_activities:
    type: plugin
    component: activities.timeline
    props:
      model: Partner

pages:

  # The partner's own compose and merge forms (demo_mail) write their layout
  # out: the checkbox goes in there too
  partner_compose:
    content:
      layout:
        - id: text
          fields:
            - *compose_activity

  partner_merge:
    content:
      layout:
        - id: text
          fields:
            - *merge_activity

  partner_list:
    panels:
      - id: activities
        pos: bottom
        height: 320
        trigger: { event: row_click, pass: [id] }
        $ref: views.partner_activities

  customer_list:
    panels:
      - id: activities
        pos: bottom
        height: 320
        trigger: { event: row_click, pass: [id] }
        $ref: views.partner_activities

  supplier_list:
    panels:
      - id: activities
        pos: bottom
        height: 320
        trigger: { event: row_click, pass: [id] }
        $ref: views.partner_activities

  # What the user under the cursor has to do, for whoever reads every
  # activity: the generated list, with the agenda beside it
  user_list:
    $auto: true
    panels:
      - id: agenda
        pos: right
        width: 460
        trigger: { event: row_click, pass: [id] }
        type: plugin
        component: activities.agenda

  my_activities:
    title: My activities
    content:
      type: plugin
      component: activities.mine

menu_items:
  my_activities: { label: My activities, icon: list-todo, order: 5, action: stack_push, panel: my_activities }

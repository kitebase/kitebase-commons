# Views of the demo application.
#
# The three partner lists are the same table seen through different eyes:
# `domain` fixes what the view shows, `defaults` fixes what a record added from
# it is born as. Both live on `source`, so the navigator stays generic.

views:

  # Column layout shared by the three partner lists. Referenced with $ref;
  # sibling keys override it, and `source` is written out by each page because
  # the merge is shallow.
  partner_table:
    type: table
    columns:
      - field: name
        title: Name
      - field: trade_name
        title: Trade name
      - field: kind
        title: Kind
        width: 110
      - field: roles
        title: Roles
        width: 110
      - field: city
        title: City
      - field: email
        title: Email
      - field: phone
        title: Phone
        width: 140
    # Partner is Archivable; the command is declared, not injected
    # (navigator.md §4h), and once here it reaches all three lists. The server
    # answers with the menu: the view to show, the verb that fits the row.
    navigator:
      commands:
        - id: archive
          label: Archive
          scope: global
          key: a
          endpoint: archivable
        # The reports of Partner, offered by the server: a menu when there are
        # several, the print dialog when there is one. `rows: view` sends the
        # rows on screen, which a report prints when none is ticked.
        - id: print
          icon: printer
          toolbar: true
          scope: global
          key: p
          endpoint: reports.print
          rows: view

pages:

  # The registry: no domain, so it is the only place where a subject that holds
  # no role yet can be found and given one.
  partner_list:
    title: All partners
    content:
      $ref: views.partner_table
      source:
        model: Partner
        order_by: [name]

  customer_list:
    title: Customers
    content:
      $ref: views.partner_table
      source:
        model: Partner
        order_by: [name]
        # Delimiters included on both sides: ",C," can never match ",CO,".
        domain: [{roles: [like, "%,C,%"]}]
        defaults: {roles: ",C,"}

  supplier_list:
    title: Suppliers
    content:
      $ref: views.partner_table
      source:
        model: Partner
        order_by: [name]
        domain: [{roles: [like, "%,S,%"]}]
        defaults: {roles: ",S,"}

  # ── What the application adds to the form the plugin wrote ───────────────
  #    Everything here is a merge: `partners` declares `partner_form` and this
  #    names the containers it wants to reach into. Nothing is redeclared, so
  #    the day the base form changes this file still applies.
  #
  #    The two policies, side by side. A field that belongs to the identity of
  #    the record goes into the section and pays the reflow — the shop sign is
  #    read every time the name is. A group that exists for a reason of its own
  #    goes into a tab, where the user reads the grouping as information: the
  #    other addresses are the same table under another `usage`, and the base
  #    put its contacts in a `tabs` alone precisely so they could sit beside it.
  partner_form:
    content:
      layout:
        - id: identity
          columns:
            - id: left
              fields:
                - name: trade_name
                  width: 30%
                  $after: name

        - id: reach
          columns:
            - id: left
              fields:
                - mobile
                - website

        - id: relations
          pages:
            - id: delivery_tab
              label: Delivery addresses
              count: delivery
              $after: contacts_tab
              layout:
                - type: collection
                  id: delivery
                  model: Partner
                  fk: parent_id
                  form: partner_child_form
                  domain: [{usage: [eq, delivery]}]
                  defaults:
                    usage: delivery
                  view:
                    type: table
                    source:
                      order_by: [name]
                    columns:
                      - field: name
                        title: Name
                      - field: address
                        title: Address
                      - field: zip
                        title: Zip
                        width: 90
                      - field: city
                        title: City
                      - field: phone
                        title: Phone
                        width: 140

            - id: invoice_tab
              label: Billing addresses
              count: invoice
              $after: delivery_tab
              layout:
                - type: collection
                  id: invoice
                  model: Partner
                  fk: parent_id
                  form: partner_child_form
                  domain: [{usage: [eq, invoice]}]
                  defaults:
                    usage: invoice
                  view:
                    type: table
                    source:
                      order_by: [name]
                    columns:
                      - field: name
                        title: Name
                      - field: address
                        title: Address
                      - field: zip
                        title: Zip
                        width: 90
                      - field: city
                        title: City
                      - field: email
                        title: Email

  # Placement of a plugin-owned component. The partners plugin ships the
  # component next to its model; where it surfaces is the application's call,
  # which is why this page lives here and not there.
  person_name_demo:
    title: Person name (placeholder)
    content:
      type: plugin
      component: partners.personname
      props:
        value: "Smith, John"

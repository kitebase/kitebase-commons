views:

  # Reaches the three partner lists through their shared view: the lists are
  # merged by `id`, so these commands join the ones demo_ui declares.
  partner_table:
    navigator:
      commands:
        - id: write_email
          label: Write an email
          help: Opens an email to the selected partner, from one of your accounts; its contacts can be picked by function.
          scope: row
          endpoint: smtp_compose
          params: { page: partner_compose }
        - id: sent_email
          label: Email sent
          help: Lists the messages sent to the selected partner, with the text of each.
          scope: row
          endpoint: smtp_sent_page
        - id: mail_merge
          label: Mail merge
          help: One text to every ticked partner, each message with the partner's own values, to the partner or to its contacts holding a function.
          scope: global
          endpoint: smtp_merge
          params: { page: partner_merge }

pages:

  # The compose form of the smtp plugin with the partner's fields to insert.
  # The content refers to the plugin's view and replaces its layout.
  partner_compose:
    title: Email to a partner
    access: smtp.send
    content:
      $ref: views.smtp_compose_form
      layout:
        - id: addresses
          type: section
          fields:
            - name: account
              label: From
              widget: combobox
              choices_endpoint: smtp_my_accounts
              required: true
            - name: to
              label: To
              widget: smtp.recipients
            - name: cc
              label: Cc
            - name: subject
              label: Subject
              required: true
        - id: text
          type: section
          fields:
            - name: body
              label: Text
              type: Markdown
              widget: markdown
              placeholders: &partner_fields
                - { name: name, label: Name }
                - { name: trade_name, label: Trade name }
                - { name: title, label: Title }
                - { name: city, label: City }
                - { name: vat_number, label: VAT number }
                - { name: parent.name, label: Belongs to }
            - name: attachments
              label: Attachments
              widget: smtp.attachments
            - name: receipt
              label: Ask for a receipt
              type: Boolean

  partner_merge:
    title: Mail merge to partners
    access: smtp.send
    content:
      $ref: views.smtp_merge_form
      layout:
        - id: addresses
          type: section
          fields:
            - name: account
              label: From
              widget: combobox
              choices_endpoint: smtp_my_accounts
              required: true
            # Whom inside each partner: the contacts holding one of these
            # functions; with none ticked, the partner's own address
            - name: functions
              label: To the contacts with function
              choices_endpoint: partner_functions
              widget: checklist
            - name: fallback
              label: When nobody holds it
              widget: combobox
              same_row: true
              choices:
                - { value: main, label: Write to the partner }
                - { value: skip, label: Skip the partner }
            - name: recipients
              label: Recipients
              widget: smtp.mergerecipients
            - name: subject
              label: Subject
              required: true
        - id: text
          type: section
          fields:
            - name: body
              label: Text
              type: Markdown
              widget: markdown
              placeholders: *partner_fields
            - name: attachments
              label: Attachments
              widget: smtp.attachments
            - name: per_contact
              label: One message per contact
              type: Boolean
              help: Each address gets a message of its own, whose placeholders read the contact; [[parent.name]] is the partner.
            - name: keep_log
              label: Keep a log of the messages
              type: Boolean
